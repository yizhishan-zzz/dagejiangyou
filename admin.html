<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>打个酱油 · 管理后台</title>
<style>
  :root {
    --coral: #F04E45;
    --cobalt: #2257D9;
    --yellow: #FFD84A;
    --mint: #55D6BE;
    --lilac: #BCA7FF;
    --brand-soft: #FFE9A6;
    --paper: #F3F4F7;
    --ink: #171717;
    --muted: #505050;
    --panel: #ffffff;
    --line: #171717;
    --border: 2.5px solid var(--line);
    --radius: 6px;
    --shadow: 5px 5px 0 rgba(23,23,23,0.18);
    --danger: #F04E45;
  }
  body.dark {
    --paper: #15161A;
    --panel: #23252B;
    --ink: #ffffff;
    --muted: #BEBEBE;
    --line: #ffffff;
    --shadow: 5px 5px 0 rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }

  /* ---------- 登录页 ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .login-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 860px;
    width: 100%;
    border: var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--panel);
  }
  .login-brand {
    background: var(--coral);
    color: #fff;
    padding: 40px 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .login-brand h1 { font-size: 34px; margin: 18px 0 8px; font-weight: 900; }
  .login-brand p { margin: 0; opacity: 0.94; line-height: 1.6; }
  .login-form { padding: 40px 34px; }
  .login-form h2 { margin: 0 0 22px; font-size: 22px; font-weight: 900; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 800; font-size: 13px; margin-bottom: 7px; }
  .field input {
    width: 100%;
    padding: 13px 14px;
    border: var(--border);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
  }
  .field input:focus { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: var(--border); border-radius: var(--radius);
    background: var(--panel); color: var(--ink);
    padding: 11px 16px; font-weight: 800; font-size: 14px;
    cursor: pointer; transition: transform .05s ease, box-shadow .05s ease;
  }
  .btn:hover { box-shadow: 3px 3px 0 rgba(23,23,23,.25); }
  .btn:active { transform: translate(1px,1px); box-shadow: none; }
  .btn-primary { background: var(--cobalt); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-mint { background: var(--mint); color: #10261f; }
  .btn-block { width: 100%; justify-content: center; }
  .login-hint { margin-top: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--panel);
    border-right: var(--border);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 0; height: 100vh;
  }
  .side-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; }
  .mark { position: relative; width: 30px; height: 30px; flex: 0 0 auto; }
  .mark i { position: absolute; display: block; border: 2.5px solid var(--line); border-radius: 4px; }
  .mark .a { inset: 0; background: var(--coral); }
  .mark .b { width: 15px; height: 15px; right: -4px; bottom: -4px; background: var(--yellow); }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: var(--radius);
    font-weight: 800; font-size: 14px; cursor: pointer;
    color: var(--ink); border: 2.5px solid transparent;
  }
  .nav-item:hover { background: var(--paper); }
  .nav-item.active { background: var(--yellow); border-color: var(--line); }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.5; padding: 0 4px; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 14px 24px;
    border-bottom: var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar-title { font-weight: 900; font-size: 19px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .admin-chip { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--cobalt); color: #fff; display: flex;
    align-items: center; justify-content: center; font-weight: 900; border: 2px solid var(--line);
  }
  .icon-btn { padding: 9px 11px; }
  .content { padding: 24px; max-width: 1200px; width: 100%; margin: 0 auto; }

  /* ---------- 通用组件 ---------- */
  .card { background: var(--panel); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 18px; }
  .section-title { font-weight: 900; font-size: 17px; margin: 0 0 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-card { border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); background: var(--panel); }
  .stat-card .value { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .stat-card .label { font-size: 13px; font-weight: 800; margin-top: 6px; opacity: .85; }
  .stat-card .sub { font-size: 12px; margin-top: 4px; opacity: .7; }
  .stat-coral { background: var(--coral); color: #fff; }
  .stat-cobalt { background: var(--cobalt); color: #fff; }
  .stat-yellow { background: var(--yellow); color: #171717; }
  .stat-mint { background: var(--mint); color: #10261f; }
  .stat-lilac { background: var(--lilac); color: #171717; }
  .stat-white { background: var(--panel); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: var(--border); border-radius: var(--radius); background: var(--panel); color: var(--ink); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  select, textarea {
    border: var(--border); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); padding: 10px 12px; font-size: 14px;
  }
  select:focus, textarea:focus, input:focus { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 12px 12px; border-bottom: 2px solid var(--line); vertical-align: middle; }
  th { font-weight: 900; font-size: 12.5px; text-transform: none; background: var(--paper); }
  tr:last-child td { border-bottom: none; }
  td .cell-main { font-weight: 800; }
  td .cell-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-weight: 800; font-size: 12px; border: 2px solid var(--line); white-space: nowrap; }
  .badge-mint { background: var(--mint); color: #10261f; }
  .badge-coral { background: var(--coral); color: #fff; }
  .badge-yellow { background: var(--yellow); color: #171717; }
  .badge-cobalt { background: var(--cobalt); color: #fff; }
  .badge-gray { background: #cfd2d9; color: #171717; }
  .badge-lilac { background: var(--lilac); color: #171717; }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-btn { padding: 6px 10px; font-size: 12.5px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 800; }
  .mini-btn:hover { box-shadow: 2px 2px 0 rgba(23,23,23,.25); }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn.mint { background: var(--mint); color: #10261f; }
  .mini-btn.yellow { background: var(--yellow); color: #171717; }

  .empty { padding: 40px; text-align: center; color: var(--muted); font-weight: 800; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .list-item { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 2px solid var(--line); }
  .list-item:last-child { border-bottom: none; }
  .list-item .t { font-weight: 800; }
  .list-item .s { font-size: 12px; color: var(--muted); }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(10,10,10,.5);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal { background: var(--panel); border: var(--border); border-radius: var(--radius); box-shadow: 8px 8px 0 rgba(0,0,0,.35); width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; font-weight: 900; }
  .modal-body { padding: 18px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; border-top: var(--border); }
  .detail-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1.5px solid var(--line); }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { font-weight: 800; color: var(--muted); white-space: nowrap; }
  .detail-row .v { text-align: right; word-break: break-all; }

  /* ---------- Toast ---------- */
  #toastRoot { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 99; }
  .toast { background: var(--ink); color: var(--paper); border: var(--border); border-radius: var(--radius); padding: 12px 16px; font-weight: 800; box-shadow: var(--shadow); max-width: 340px; animation: slidein .18s ease; }
  .toast.ok { background: #1f8a5b; color: #fff; }
  .toast.err { background: var(--danger); color: #fff; }
  @keyframes slidein { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; border-right: none; border-bottom: var(--border); }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .side-foot { display: none; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
    .login-card { grid-template-columns: 1fr; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark"><i class="a"></i><i class="b"></i></span>
      <h1>打个酱油</h1>
      <p>社区微物流 · 管理后台<br/>对接真实后端数据库。</p>
    </div>
    <div class="login-form">
      <h2>管理员登录</h2>
      <form id="loginForm">
        <div class="field">
          <label>后端地址</label>
          <input id="baseUrlInput" type="text" placeholder="http://127.0.0.1:8080/api/v1" />
        </div>
        <div class="field">
          <label>管理员手机号</label>
          <input id="loginPhone" type="text" autocomplete="username" placeholder="13800000099" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">进入后台</button>
      </form>
      <p class="login-hint">演示管理员账号 <b>13800000099</b> / 密码 <b>demo123456</b>。<br/>需先启动后端（默认 8080），并用 HTTP（如 4100）打开本页，不能 file:// 双击。</p>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="side-brand"><span class="mark"><i class="a"></i><i class="b"></i></span> 打个酱油</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">真实后端 · 数据来自数据库<br/>后端地址可点右上角「后端地址」修改</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="viewTitle">数据总览</div>
      <div class="topbar-actions">
        <span class="admin-chip"><span class="avatar" id="adminAvatar">管</span> <span id="adminName">管理员</span></span>
        <button class="btn" id="settingsBtn">后端地址</button>
        <button class="btn btn-danger" id="logoutBtn">退出</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  'use strict';

  var LS_BASE = 'dsj_admin_base_url';
  var LS_TOKEN = 'dsj_admin_access';
  var LS_REFRESH = 'dsj_admin_refresh';
  var LS_USER = 'dsj_admin_user';
  var DEFAULT_BASE = 'http://127.0.0.1:8080/api/v1';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function num(v) { return (v === null || v === undefined) ? 0 : v; }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function shortId(id) { return id ? String(id).slice(0, 8) : ''; }

  var state = {
    baseUrl: lsGet(LS_BASE) || DEFAULT_BASE,
    accessToken: lsGet(LS_TOKEN) || '',
    refreshToken: lsGet(LS_REFRESH) || '',
    user: null,
    usersCache: null,
    currentView: 'dashboard'
  };
  try { state.user = JSON.parse(lsGet(LS_USER) || 'null'); } catch (e) { state.user = null; }

  function sanitizeBase(u) { return String(u || '').replace(/\/+$/, ''); }

  /* ---------- toast / modal ---------- */
  function toast(msg, type) {
    var root = document.getElementById('toastRoot');
    var el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }
  function openModal(title, bodyHtml, footHtml) {
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-mask" id="modalMask"><div class="modal">' +
      '<div class="modal-head"><h3>' + esc(title) + '</h3><button class="btn icon-btn" data-close="1">✕</button></div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      (footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '') +
      '</div></div>';
  }
  function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

  /* ---------- API ---------- */
  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Accept': 'application/json' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    if (state.accessToken) headers['Authorization'] = 'Bearer ' + state.accessToken;
    return fetch(sanitizeBase(state.baseUrl) + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      if (res.status === 401 && state.refreshToken && !opts._retried) {
        return doRefresh().then(function (ok) {
          if (!ok) { logout(); var e1 = new Error('登录已过期，请重新登录'); e1.status = 401; throw e1; }
          opts._retried = true;
          return api(path, opts);
        });
      }
      return parseRes(res);
    }).catch(function (e) {
      if (e && e.name === 'TypeError') throw new Error('无法连接后端，请确认后端已启动、地址正确，且本页通过 HTTP 打开');
      throw e;
    });
  }
  function parseRes(res) {
    return res.text().then(function (text) {
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
      if (!res.ok) {
        var msg = (data && data.message) ? data.message : ('请求失败 (' + res.status + ')');
        if (res.status === 403) msg = '无权限：该账号不是管理员（或未授予 ADMIN 角色）';
        var err = new Error(msg); err.status = res.status; throw err;
      }
      return data;
    });
  }
  function doRefresh() {
    return fetch(sanitizeBase(state.baseUrl) + '/users/auth/refresh', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: state.refreshToken })
    }).then(function (res) { return res.json(); }).then(function (data) {
      if (!data || !data.accessToken) return false;
      state.accessToken = data.accessToken;
      state.refreshToken = data.refreshToken || state.refreshToken;
      lsSet(LS_TOKEN, state.accessToken);
      lsSet(LS_REFRESH, state.refreshToken);
      return true;
    }).catch(function () { return false; });
  }

  /* ---------- auth ---------- */
  function isLoggedIn() { return !!state.accessToken; }
  function showApp() {
    document.getElementById('loginScreen').hidden = true;
    document.getElementById('app').hidden = false;
    if (state.user) {
      document.getElementById('adminName').textContent = state.user.displayName || '管理员';
      document.getElementById('adminAvatar').textContent = state.user.avatarEmoji || '管';
    }
    renderNav();
    renderView(state.currentView);
  }
  function showLogin() {
    document.getElementById('app').hidden = true;
    document.getElementById('loginScreen').hidden = false;
    document.getElementById('baseUrlInput').value = state.baseUrl;
  }
  function logout() {
    state.accessToken = ''; state.refreshToken = ''; state.user = null; state.usersCache = null;
    lsDel(LS_TOKEN); lsDel(LS_REFRESH); lsDel(LS_USER);
    showLogin();
  }

  /* ---------- nav ---------- */
  var NAV = [
    { key: 'dashboard', icon: 'grid', label: '数据总览' },
    { key: 'users', icon: 'users', label: '账号管理' },
    { key: 'tasks', icon: 'package', label: '任务管理' }
  ];
  var VIEW_TITLE = { dashboard: '数据总览', users: '账号管理', tasks: '任务管理' };

  var ICON = {
    grid: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
    package: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>',
    search: '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
    refresh: '<polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>'
  };
  function icon(name, size) {
    return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICON[name] || '') + '</svg>';
  }

  function renderNav() {
    var html = '';
    for (var i = 0; i < NAV.length; i++) {
      html += '<a class="nav-item' + (NAV[i].key === state.currentView ? ' active' : '') + '" data-view="' + NAV[i].key + '">' + icon(NAV[i].icon) + '<span>' + NAV[i].label + '</span></a>';
    }
    document.getElementById('nav').innerHTML = html;
  }
  function switchView(key) {
    state.currentView = key;
    renderNav();
    document.getElementById('viewTitle').textContent = VIEW_TITLE[key];
    renderView(key);
  }

  /* ---------- 标签映射 ---------- */
  function accountStatusLabel(s) { return ({ACTIVE:'正常', SUSPENDED:'已停用', CLOSED:'已注销'})[s] || s; }
  function taskStatusLabel(s) { return ({OPEN:'待接单', ACCEPTED:'已接单', PICKED_UP:'已取件', ARRIVED:'已到达', COMPLETED:'已完成', CANCELLED:'已取消'})[s] || s; }
  function taskTypeLabel(s) { return ({PACKAGE_PICKUP:'快递代取', ERRAND:'跑腿代买', POOL:'社区拼单'})[s] || s; }
  function modeLabel(s) { return ({CREATOR:'发布者', RUNNER:'跑者'})[s] || s; }
  function accountTone(s) { return s === 'ACTIVE' ? 'mint' : (s === 'SUSPENDED' ? 'coral' : 'gray'); }
  function taskTone(s) { if (s === 'OPEN') return 'yellow'; if (s === 'COMPLETED') return 'mint'; if (s === 'CANCELLED') return 'gray'; return 'cobalt'; }
  function badge(tone, text) { return '<span class="badge badge-' + tone + '">' + esc(text) + '</span>'; }

  function setLoading(msg) { document.getElementById('content').innerHTML = '<div class="empty">' + esc(msg) + '</div>'; }
  function errorHtml(msg) { return '<div class="card card-pad"><div class="empty">⚠ ' + esc(msg) + '</div><div class="empty" style="padding-top:0"><button class="btn" data-action="retry">重试</button></div></div>'; }

  /* ---------- 视图分发 ---------- */
  function renderView(key) {
    if (key === 'dashboard') loadDashboard();
    else if (key === 'users') loadUsers();
    else if (key === 'tasks') loadTasks();
  }

  /* ---------- 仪表盘 ---------- */
  function loadDashboard() {
    setLoading('正在加载数据总览...');
    api('/admin/overview').then(function (d) {
      document.getElementById('content').innerHTML = renderDashboardHtml(d);
    }).catch(function (err) {
      if (err.status === 401) { showLogin(); return; }
      document.getElementById('content').innerHTML = errorHtml(err.message);
    });
  }
  function renderDashboardHtml(d) {
    function card(tone, val, label, sub) {
      return '<div class="stat-card stat-' + tone + '"><div class="value">' + num(val) + '</div><div class="label">' + label + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
    }
    var html = '<div class="stat-grid" style="margin-bottom:16px">' +
      card('cobalt', d.totalUsers, '总用户数', '含普通用户与管理员') +
      card('mint', d.activeUsers, '正常账号', '可正常接发任务') +
      card('coral', d.suspendedUsers, '停用账号', '需人工复核') +
      card('lilac', d.openTasks, '待接单任务', '等待跑者响应') +
      '</div>';
    html += '<div class="stat-grid">' +
      card('cobalt', d.inProgressTasks, '进行中任务', '已接单 / 配送中') +
      card('mint', d.completedTasks, '已完成任务', '履约完成') +
      card('yellow', d.todayVisits, '今日访问', '今日登录次数') +
      card('lilac', d.totalVisits, '总访问次数', '累计登录次数') +
      '</div>';
    html += '<div class="card card-pad" style="margin-top:16px"><h3 class="section-title">数据来源</h3>' +
      '<p class="small muted">以上指标来自后端 <span class="mono">GET /admin/overview</span>，实时读取数据库；「访问次数」统计自接入统计功能后的登录次数。</p></div>';
    return html;
  }

  /* ---------- 账号管理 ---------- */
  function loadUsers() {
    setLoading('正在加载账号...');
    api('/admin/users').then(function (users) {
      state.usersCache = users;
      document.getElementById('content').innerHTML = renderUsersHtml(users);
      bindUsers();
    }).catch(function (err) {
      if (err.status === 401) { showLogin(); return; }
      document.getElementById('content').innerHTML = errorHtml(err.message);
    });
  }
  function renderUsersHtml(users) {
    var html = '<div class="toolbar">' +
      '<div class="search">' + icon('search') + '<input id="userSearch" type="text" placeholder="搜索昵称 / 手机号" /></div>' +
      '<select id="userStatusFilter"><option value="">全部状态</option><option value="ACTIVE">正常</option><option value="SUSPENDED">已停用</option><option value="CLOSED">已注销</option></select>' +
      '<span class="small muted">共 ' + (users ? users.length : 0) + ' 人</span></div>';
    html += '<div class="card"><div class="table-wrap"><table><thead><tr>' +
      '<th>用户</th><th>手机号</th><th>模式</th><th>角色</th><th>状态</th><th>信用分</th><th>社区</th><th>注册时间</th><th>操作</th>' +
      '</tr></thead><tbody id="usersBody"></tbody></table></div></div>';
    return html;
  }
  function bindUsers() {
    var search = document.getElementById('userSearch');
    var statusF = document.getElementById('userStatusFilter');
    function apply() {
      var q = search.value.trim().toLowerCase();
      var st = statusF.value;
      var rows = (state.usersCache || []).filter(function (u) {
        if (st && u.accountStatus !== st) return false;
        if (q && (u.displayName.toLowerCase().indexOf(q) < 0 && u.phoneNumber.indexOf(q) < 0)) return false;
        return true;
      }).map(function (u) {
        var acts = '';
        if (u.systemRole === 'ADMIN') acts += '<span class="small muted">不可操作</span>';
        else if (u.accountStatus === 'ACTIVE') acts += '<button class="mini-btn danger" data-action="suspend" data-id="' + u.userId + '">停用</button>';
        else if (u.accountStatus === 'SUSPENDED') acts += '<button class="mini-btn mint" data-action="activate" data-id="' + u.userId + '">恢复</button>';
        return '<tr>' +
          '<td><div class="cell-main">' + esc(u.avatarEmoji || '邻') + ' ' + esc(u.displayName) + '</div></td>' +
          '<td class="mono">' + esc(u.phoneNumber) + '</td>' +
          '<td>' + esc(modeLabel(u.activeMode)) + '</td>' +
          '<td>' + (u.systemRole === 'ADMIN' ? badge('lilac', '管理员') : esc('普通用户')) + '</td>' +
          '<td>' + badge(accountTone(u.accountStatus), accountStatusLabel(u.accountStatus)) + '</td>' +
          '<td>' + (u.creditScore != null ? u.creditScore : '—') + '</td>' +
          '<td>' + esc(u.communityName || '—') + '</td>' +
          '<td class="small">' + fmtDate(u.createdAt) + '</td>' +
          '<td><div class="row-actions">' + acts + '</div></td>' +
          '</tr>';
      }).join('');
      document.getElementById('usersBody').innerHTML = rows || '<tr><td colspan="9"><div class="empty">没有匹配的用户</div></td></tr>';
    }
    search.addEventListener('input', apply);
    statusF.addEventListener('change', apply);
    apply();
  }
  function changeUserStatus(id, status) {
    api('/admin/users/' + id + '/status', { method: 'PATCH', body: { accountStatus: status } })
      .then(function () { toast(status === 'SUSPENDED' ? '已停用该账号' : '已恢复该账号', 'ok'); loadUsers(); })
      .catch(function (err) { toast(err.message, 'err'); });
  }

  /* ---------- 任务管理 ---------- */
  function loadTasks() {
    setLoading('正在加载任务...');
    var usersP = state.usersCache ? Promise.resolve(state.usersCache) : api('/admin/users');
    Promise.all([api('/admin/tasks'), usersP]).then(function (res) {
      var tasks = res[0]; var users = res[1];
      state.usersCache = users;
      var nameById = {};
      (users || []).forEach(function (u) { nameById[u.userId] = u.displayName; });
      document.getElementById('content').innerHTML = renderTasksHtml(tasks);
      bindTasks(tasks, nameById);
    }).catch(function (err) {
      if (err.status === 401) { showLogin(); return; }
      document.getElementById('content').innerHTML = errorHtml(err.message);
    });
  }
  function renderTasksHtml(tasks) {
    var html = '<div class="toolbar">' +
      '<div class="search">' + icon('search') + '<input id="taskSearch" type="text" placeholder="搜索任务标题" /></div>' +
      '<select id="taskStatusFilter"><option value="">全部状态</option><option value="OPEN">待接单</option><option value="ACCEPTED">已接单</option><option value="PICKED_UP">已取件</option><option value="ARRIVED">已到达</option><option value="COMPLETED">已完成</option><option value="CANCELLED">已取消</option></select>' +
      '<span class="small muted">共 ' + (tasks ? tasks.length : 0) + ' 单</span></div>';
    html += '<div class="card"><div class="table-wrap"><table><thead><tr>' +
      '<th>任务</th><th>类型</th><th>状态</th><th>发布人</th><th>接单人</th><th>小费(¥)</th><th>发布时间</th>' +
      '</tr></thead><tbody id="tasksBody"></tbody></table></div></div>';
    return html;
  }
  function bindTasks(tasks, nameById) {
    var search = document.getElementById('taskSearch');
    var statusF = document.getElementById('taskStatusFilter');
    function apply() {
      var q = search.value.trim().toLowerCase();
      var st = statusF.value;
      var rows = (tasks || []).filter(function (t) {
        if (st && t.status !== st) return false;
        if (q && t.title.toLowerCase().indexOf(q) < 0) return false;
        return true;
      }).map(function (t) {
        return '<tr>' +
          '<td><div class="cell-main">' + esc(t.title) + '</div><div class="cell-sub mono">' + esc(t.taskId) + '</div></td>' +
          '<td>' + esc(taskTypeLabel(t.taskType)) + '</td>' +
          '<td>' + badge(taskTone(t.status), taskStatusLabel(t.status)) + '</td>' +
          '<td>' + esc(nameById[t.creatorId] || shortId(t.creatorId)) + '</td>' +
          '<td>' + (t.runnerId ? esc(nameById[t.runnerId] || shortId(t.runnerId)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (t.suggestedTip != null ? t.suggestedTip : 0) + '</td>' +
          '<td class="small">' + fmtDate(t.createdAt) + '</td>' +
          '</tr>';
      }).join('');
      document.getElementById('tasksBody').innerHTML = rows || '<tr><td colspan="7"><div class="empty">没有匹配的任务</div></td></tr>';
    }
    search.addEventListener('input', apply);
    statusF.addEventListener('change', apply);
    apply();
  }

  /* ---------- 设置（后端地址） ---------- */
  function openSettings() {
    openModal('后端地址',
      '<div class="field"><label>后端 API 地址（以 /api/v1 结尾）</label><input id="baseUrlEdit" type="text" value="' + esc(state.baseUrl) + '" /></div>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-primary" id="baseUrlSave">保存</button>');
    document.getElementById('baseUrlSave').onclick = function () {
      var v = document.getElementById('baseUrlEdit').value.trim();
      if (!v) { toast('地址不能为空', 'err'); return; }
      state.baseUrl = v;
      lsSet(LS_BASE, v);
      closeModal();
      toast('后端地址已更新，将用于后续请求', 'ok');
    };
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest && t.closest('[data-close]')) { closeModal(); return; }
    var nav = t.closest && t.closest('[data-view]');
    if (nav) { switchView(nav.getAttribute('data-view')); return; }
    var act = t.closest && t.closest('[data-action]');
    if (act) {
      var action = act.getAttribute('data-action');
      var id = act.getAttribute('data-id');
      if (action === 'suspend') changeUserStatus(id, 'SUSPENDED');
      else if (action === 'activate') changeUserStatus(id, 'ACTIVE');
      else if (action === 'retry') renderView(state.currentView);
    }
  });
  document.getElementById('modalRoot').addEventListener('click', function (e) {
    if (e.target.id === 'modalMask') closeModal();
  });
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var base = document.getElementById('baseUrlInput').value.trim();
    if (base) { state.baseUrl = base; lsSet(LS_BASE, base); }
    var phone = document.getElementById('loginPhone').value.trim();
    var password = document.getElementById('loginPass').value;
    if (!phone || !password) { toast('请输入手机号和密码', 'err'); return; }
    api('/users/auth/password-login', { method: 'POST', body: { phoneNumber: phone, password: password } })
      .then(function (session) {
        state.accessToken = session.accessToken;
        state.refreshToken = session.refreshToken;
        state.user = { userId: session.userId, displayName: session.displayName, avatarEmoji: session.avatarEmoji, phoneNumber: session.phoneNumber };
        lsSet(LS_TOKEN, session.accessToken);
        lsSet(LS_REFRESH, session.refreshToken);
        lsSet(LS_USER, JSON.stringify(state.user));
        showApp();
      })
      .catch(function (err) { toast(err.message, 'err'); });
  });
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('settingsBtn').onclick = openSettings;

  /* ---------- 启动 ---------- */
  if (isLoggedIn()) showApp(); else showLogin();
})();
</script>

</body>
</html>
