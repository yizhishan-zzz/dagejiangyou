<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>打个酱油 · 管理后台</title>
<style>
  :root {
    --coral: #F04E45;
    --cobalt: #2257D9;
    --yellow: #FFD84A;
    --mint: #55D6BE;
    --lilac: #BCA7FF;
    --brand-soft: #FFE9A6;
    --paper: #F3F4F7;
    --ink: #171717;
    --muted: #505050;
    --panel: #ffffff;
    --line: #171717;
    --border: 2.5px solid var(--line);
    --radius: 6px;
    --shadow: 5px 5px 0 rgba(23,23,23,0.18);
    --danger: #F04E45;
  }
  body.dark {
    --paper: #15161A;
    --panel: #23252B;
    --ink: #ffffff;
    --muted: #BEBEBE;
    --line: #ffffff;
    --shadow: 5px 5px 0 rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }

  /* ---------- 登录页 ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .login-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 860px;
    width: 100%;
    border: var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--panel);
  }
  .login-brand {
    background: var(--coral);
    color: #fff;
    padding: 40px 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .login-brand h1 { font-size: 34px; margin: 18px 0 8px; font-weight: 900; }
  .login-brand p { margin: 0; opacity: 0.94; line-height: 1.6; }
  .login-form { padding: 40px 34px; }
  .login-form h2 { margin: 0 0 22px; font-size: 22px; font-weight: 900; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 800; font-size: 13px; margin-bottom: 7px; }
  .field input {
    width: 100%;
    padding: 13px 14px;
    border: var(--border);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
  }
  .field input:focus { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: var(--border); border-radius: var(--radius);
    background: var(--panel); color: var(--ink);
    padding: 11px 16px; font-weight: 800; font-size: 14px;
    cursor: pointer; transition: transform .05s ease, box-shadow .05s ease;
  }
  .btn:hover { box-shadow: 3px 3px 0 rgba(23,23,23,.25); }
  .btn:active { transform: translate(1px,1px); box-shadow: none; }
  .btn-primary { background: var(--cobalt); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-mint { background: var(--mint); color: #10261f; }
  .btn-block { width: 100%; justify-content: center; }
  .login-hint { margin-top: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--panel);
    border-right: var(--border);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 0; height: 100vh;
  }
  .side-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; }
  .mark { position: relative; width: 30px; height: 30px; flex: 0 0 auto; }
  .mark i { position: absolute; display: block; border: 2.5px solid var(--line); border-radius: 4px; }
  .mark .a { inset: 0; background: var(--coral); }
  .mark .b { width: 15px; height: 15px; right: -4px; bottom: -4px; background: var(--yellow); }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: var(--radius);
    font-weight: 800; font-size: 14px; cursor: pointer;
    color: var(--ink); border: 2.5px solid transparent;
  }
  .nav-item:hover { background: var(--paper); }
  .nav-item.active { background: var(--yellow); border-color: var(--line); }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.5; padding: 0 4px; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 14px 24px;
    border-bottom: var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar-title { font-weight: 900; font-size: 19px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .admin-chip { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--cobalt); color: #fff; display: flex;
    align-items: center; justify-content: center; font-weight: 900; border: 2px solid var(--line);
  }
  .icon-btn { padding: 9px 11px; }
  .content { padding: 24px; max-width: 1200px; width: 100%; margin: 0 auto; }

  /* ---------- 通用组件 ---------- */
  .card { background: var(--panel); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 18px; }
  .section-title { font-weight: 900; font-size: 17px; margin: 0 0 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-card { border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); background: var(--panel); }
  .stat-card .value { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .stat-card .label { font-size: 13px; font-weight: 800; margin-top: 6px; opacity: .85; }
  .stat-card .sub { font-size: 12px; margin-top: 4px; opacity: .7; }
  .stat-coral { background: var(--coral); color: #fff; }
  .stat-cobalt { background: var(--cobalt); color: #fff; }
  .stat-yellow { background: var(--yellow); color: #171717; }
  .stat-mint { background: var(--mint); color: #10261f; }
  .stat-lilac { background: var(--lilac); color: #171717; }
  .stat-white { background: var(--panel); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: var(--border); border-radius: var(--radius); background: var(--panel); color: var(--ink); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  select, textarea {
    border: var(--border); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); padding: 10px 12px; font-size: 14px;
  }
  select:focus, textarea:focus, input:focus { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 12px 12px; border-bottom: 2px solid var(--line); vertical-align: middle; }
  th { font-weight: 900; font-size: 12.5px; text-transform: none; background: var(--paper); }
  tr:last-child td { border-bottom: none; }
  td .cell-main { font-weight: 800; }
  td .cell-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-weight: 800; font-size: 12px; border: 2px solid var(--line); white-space: nowrap; }
  .badge-mint { background: var(--mint); color: #10261f; }
  .badge-coral { background: var(--coral); color: #fff; }
  .badge-yellow { background: var(--yellow); color: #171717; }
  .badge-cobalt { background: var(--cobalt); color: #fff; }
  .badge-gray { background: #cfd2d9; color: #171717; }
  .badge-lilac { background: var(--lilac); color: #171717; }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-btn { padding: 6px 10px; font-size: 12.5px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 800; }
  .mini-btn:hover { box-shadow: 2px 2px 0 rgba(23,23,23,.25); }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn.mint { background: var(--mint); color: #10261f; }
  .mini-btn.yellow { background: var(--yellow); color: #171717; }

  .empty { padding: 40px; text-align: center; color: var(--muted); font-weight: 800; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .list-item { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 2px solid var(--line); }
  .list-item:last-child { border-bottom: none; }
  .list-item .t { font-weight: 800; }
  .list-item .s { font-size: 12px; color: var(--muted); }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(10,10,10,.5);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal { background: var(--panel); border: var(--border); border-radius: var(--radius); box-shadow: 8px 8px 0 rgba(0,0,0,.35); width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; font-weight: 900; }
  .modal-body { padding: 18px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; border-top: var(--border); }
  .detail-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1.5px solid var(--line); }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { font-weight: 800; color: var(--muted); white-space: nowrap; }
  .detail-row .v { text-align: right; word-break: break-all; }

  /* ---------- Toast ---------- */
  #toastRoot { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 99; }
  .toast { background: var(--ink); color: var(--paper); border: var(--border); border-radius: var(--radius); padding: 12px 16px; font-weight: 800; box-shadow: var(--shadow); max-width: 340px; animation: slidein .18s ease; }
  .toast.ok { background: #1f8a5b; color: #fff; }
  .toast.err { background: var(--danger); color: #fff; }
  @keyframes slidein { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; border-right: none; border-bottom: var(--border); }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .side-foot { display: none; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
    .login-card { grid-template-columns: 1fr; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark"><i class="a"></i><i class="b"></i></span>
      <h1>打个酱油</h1>
      <p>社区微物流 · 管理后台<br/>本地离线版，数据仅保存在当前浏览器。</p>
    </div>
    <div class="login-form">
      <h2>管理员登录</h2>
      <form id="loginForm">
        <div class="field">
          <label>管理员账号</label>
          <input id="loginUser" type="text" autocomplete="username" placeholder="admin" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">进入后台</button>
        <button class="btn btn-block" type="button" id="resetLocalBtn" style="margin-top:10px">忘记密码？重置本地数据</button>
      </form>
      <p class="login-hint">默认账号 <b>admin</b> / 密码 <b>admin123</b>（仅本地有效）。<br/>登录后可在右上角「修改密码」。</p>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="side-brand"><span class="mark"><i class="a"></i><i class="b"></i></span> 打个酱油</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">本地模式 · 前后端不分离<br/>数据存于 localStorage，可导出备份。</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="viewTitle">数据总览</div>
      <div class="topbar-actions">
        <button class="btn icon-btn" id="themeBtn" title="切换深浅色"></button>
        <button class="btn" id="changePwdBtn">修改密码</button>
        <div class="admin-chip"><span class="avatar">管</span> 平台管理员</div>
        <button class="btn btn-danger" id="logoutBtn">退出</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json, .json" hidden />

<script>
(function () {
  'use strict';

  /* ---------------- 工具 ---------------- */
  var LS_DB = 'dsj_admin_db_v1';
  var LS_THEME = 'dsj_admin_theme';
  var SS_SESSION = 'dsj_admin_session';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function hashStr(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  function randomSalt() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }
  function uid() {
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var ICON = {
    grid: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
    package: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>',
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line>',
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
    search: '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
    refresh: '<polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>',
    x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>',
    sun: '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>',
    check: '<polyline points="20 6 9 17 4 12"></polyline>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>'
  };
  function icon(name, size) {
    var body = ICON[name] || '';
    return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  /* ---------------- 标签映射 ---------------- */
  function taskStatusLabel(s) { return ({OPEN:'待接单', ACCEPTED:'已接单', PICKED_UP:'已取件', ARRIVED:'已到达', COMPLETED:'已完成', CANCELLED:'已取消'})[s] || s; }
  function disputeStatusLabel(s) { return ({OPEN:'待处理', UNDER_REVIEW:'审核中', RESOLVED:'已解决', REJECTED:'已驳回'})[s] || s; }
  function accountStatusLabel(s) { return ({ACTIVE:'正常', SUSPENDED:'已停用', CLOSED:'已注销'})[s] || s; }
  function taskTypeLabel(s) { return ({PACKAGE_PICKUP:'快递代取', ERRAND:'跑腿代买', POOL:'社区拼单'})[s] || s; }
  function modeLabel(s) { return ({CREATOR:'发布者', RUNNER:'跑者'})[s] || s; }
  function roleLabel(s) { return ({USER:'普通用户', ADMIN:'管理员'})[s] || s; }

  function accountTone(s) { return s === 'ACTIVE' ? 'mint' : (s === 'SUSPENDED' ? 'coral' : 'gray'); }
  function taskTone(s) { if (s === 'OPEN') return 'yellow'; if (s === 'COMPLETED') return 'mint'; if (s === 'CANCELLED') return 'gray'; return 'cobalt'; }
  function disputeTone(s) { if (s === 'OPEN') return 'coral'; if (s === 'UNDER_REVIEW') return 'yellow'; if (s === 'RESOLVED') return 'mint'; return 'gray'; }
  function badge(tone, text) { return '<span class="badge badge-' + tone + '">' + esc(text) + '</span>'; }

  /* ---------------- 种子数据 ---------------- */
  function buildSeed() {
    var now = new Date().toISOString();
    return {
      meta: { version: 1, createdAt: now, updatedAt: now },
      auth: { username: 'admin', salt: randomSalt(), hash: '' },
      users: [

  /* ---------------- 数据存取 ---------------- */
  var db = load();

  function load() {
    try {
      var raw = localStorage.getItem(LS_DB);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.users && parsed.tasks && parsed.disputes && parsed.auth) {
          return parsed;
        }
      }
    } catch (e) { /* 忽略损坏数据，重建种子 */ }
    return freshSeed();
  }
  function freshSeed() {
    var seed = buildSeed();
    seed.auth.hash = hashStr(seed.auth.salt + ':' + 'admin123');
    return seed;
  }
  function persist() {
    db.meta.updatedAt = new Date().toISOString();
    try { localStorage.setItem(LS_DB, JSON.stringify(db)); } catch (e) { toast('保存失败：浏览器存储不可用或已满', 'err'); }
  }
  function resetDb() {
    db = freshSeed();
    persist();
  }

  function userById(id) {
    for (var i = 0; i < db.users.length; i++) if (db.users[i].id === id) return db.users[i];
    return null;
  }
  function userName(id) {
    var u = userById(id);
    return u ? u.displayName : '未知用户';
  }

  /* ---------------- 会话 & 登录 ---------------- */
  function isLoggedIn() {
    try { return sessionStorage.getItem(SS_SESSION) === '1'; } catch (e) { return false; }
  }
  function showApp() {
    document.getElementById('loginScreen').hidden = true;
    document.getElementById('app').hidden = false;
    renderNav();
    renderView(currentView);
  }
  function showLogin() {
    document.getElementById('app').hidden = true;
    document.getElementById('loginScreen').hidden = false;
  }

  /* ---------------- Toast / Modal ---------------- */
  function toast(msg, type) {
    var root = document.getElementById('toastRoot');
    var el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }
  function openModal(title, bodyHtml, footHtml) {
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-mask" id="modalMask">' +
        '<div class="modal">' +
          '<div class="modal-head"><h3>' + esc(title) + '</h3><button class="btn icon-btn" data-close="1" aria-label="关闭">' + icon('x', 18) + '</button></div>' +
          '<div class="modal-body">' + bodyHtml + '</div>' +
          (footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '') +
        '</div>' +
      '</div>';
  }
  function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

  /* ---------------- 导航 ---------------- */
  var NAV = [
    { key: 'overview', icon: 'grid', label: '数据总览' },
    { key: 'users', icon: 'users', label: '用户管理' },
    { key: 'tasks', icon: 'package', label: '任务管理' },
    { key: 'disputes', icon: 'flag', label: '纠纷处理' },
    { key: 'data', icon: 'database', label: '数据管理' }
  ];
  var VIEW_TITLE = { overview: '数据总览', users: '用户管理', tasks: '任务管理', disputes: '纠纷处理', data: '数据管理' };
  var currentView = 'overview';

  function renderNav() {
    var html = '';
    for (var i = 0; i < NAV.length; i++) {
      html += '<a class="nav-item' + (NAV[i].key === currentView ? ' active' : '') + '" data-view="' + NAV[i].key + '">' + icon(NAV[i].icon, 18) + '<span>' + NAV[i].label + '</span></a>';
    }
    document.getElementById('nav').innerHTML = html;
  }
  function switchView(key) {
    currentView = key;
    renderNav();
    document.getElementById('viewTitle').textContent = VIEW_TITLE[key];
    renderView(key);
  }

  /* ---------------- 渲染 ---------------- */
  function renderView(key) {
    var content = document.getElementById('content');
    if (key === 'overview') content.innerHTML = renderOverview();
    else if (key === 'users') content.innerHTML = renderUsers();
    else if (key === 'tasks') content.innerHTML = renderTasks();
    else if (key === 'disputes') content.innerHTML = renderDisputes();
    else if (key === 'data') content.innerHTML = renderData();
    bindInline();
  }

  function statCard(tone, value, label, sub) {
    return '<div class="stat-card stat-' + tone + '"><div class="value">' + value + '</div><div class="label">' + label + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  function renderOverview() {
    var active = 0, suspended = 0;
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].accountStatus === 'ACTIVE') active++;
      else if (db.users[i].accountStatus === 'SUSPENDED') suspended++;
    }
    var open = 0, progress = 0, done = 0;
    for (var j = 0; j < db.tasks.length; j++) {
      var s = db.tasks[j].status;
      if (s === 'OPEN') open++;
      else if (s === 'ACCEPTED' || s === 'PICKED_UP' || s === 'ARRIVED') progress++;
      else if (s === 'COMPLETED') done++;
    }
    var openD = 0, resolvedD = 0;
    for (var k = 0; k < db.disputes.length; k++) {
      var ds = db.disputes[k].status;
      if (ds === 'OPEN' || ds === 'UNDER_REVIEW') openD++;
      else if (ds === 'RESOLVED') resolvedD++;
    }

    var html = '';
    html += '<div class="stat-grid" style="margin-bottom:16px">' +
      statCard('cobalt', db.users.length, '总用户数', '含普通用户与管理员') +
      statCard('mint', active, '正常账号', '可正常接发任务') +
      statCard('coral', suspended, '已停用账号', '需人工复核') +
      statCard('lilac', db.tasks.length, '总任务数', '全部历史任务') +
      '</div>';
    html += '<div class="stat-grid" style="margin-bottom:16px">' +
      statCard('yellow', open, '待接单', '等待跑者响应') +
      statCard('cobalt', progress, '进行中', '已接单 / 配送中') +
      statCard('mint', done, '已完成', '履约完成') +
      statCard('coral', openD, '待处理纠纷', '需管理员介入') +
      '</div>';

    html += '<div class="two-col">';

    html += '<div class="card card-pad"><h3 class="section-title">待处理纠纷</h3>';
    var pendingD = db.disputes.filter(function (d) { return d.status === 'OPEN' || d.status === 'UNDER_REVIEW'; });
    if (pendingD.length === 0) html += '<div class="empty">暂无待处理纠纷</div>';
    else {
      html += pendingD.slice(0, 5).map(function (d) {
        return '<div class="list-item"><div><div class="t">' + esc(d.reason) + '</div><div class="s">' + userName(d.openedBy) + ' 发起 · ' + fmtDate(d.createdAt) + '</div></div>' + badge(disputeTone(d.status), disputeStatusLabel(d.status)) + '</div>';
      }).join('');
    }
    html += '<div style="margin-top:12px"><button class="btn" data-goto="disputes">前往处理纠纷</button></div></div>';

    html += '<div class="card card-pad"><h3 class="section-title">最近任务</h3>';
    var recent = db.tasks.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    if (recent.length === 0) html += '<div class="empty">暂无任务</div>';
    else {
      html += recent.slice(0, 5).map(function (t) {
        return '<div class="list-item"><div><div class="t">' + esc(t.title) + '</div><div class="s">' + taskTypeLabel(t.taskType) + ' · ' + userName(t.creatorId) + '</div></div>' + badge(taskTone(t.status), taskStatusLabel(t.status)) + '</div>';
      }).join('');
    }
    html += '<div style="margin-top:12px"><button class="btn" data-goto="tasks">查看全部任务</button></div></div>';

    html += '</div>';
    return html;
  }

  function renderUsers() {
    var html = '<div class="toolbar">' +
      '<div class="search">' + icon('search', 18) + '<input id="userSearch" type="text" placeholder="搜索昵称 / 手机号" value="' + esc(userSearchQ) + '" /></div>' +

    } else {
      html += users.map(function (u) {
        var acts = '';

          if (u.accountStatus === 'ACTIVE') {
            acts += '<button class="mini-btn danger" data-action="suspend-user" data-id="' + u.id + '">停用</button>';

          }
          acts += '<button class="mini-btn" data-action="credit-user" data-id="' + u.id + '">调信用分</button>';
        } else {
          acts += '<span class="small muted">不可操作</span>';
        }
        acts += '<button class="mini-btn yellow" data-action="view-user" data-id="' + u.id + '">详情</button>';
        return '<tr>' +
          '<td><div class="cell-main"><span class="avatar" style="display:inline-flex;width:26px;height:26px;font-size:13px;margin-right:8px;vertical-align:middle">' + esc(u.avatarEmoji || '邻') + '</span>' + esc(u.displayName) + '</div></td>' +
          '<td class="mono">' + esc(u.phoneNumber) + '</td>' +

          '<td>' + badge(accountTone(u.accountStatus), accountStatusLabel(u.accountStatus)) + '</td>' +
          '<td><b>' + u.creditScore.toFixed(1) + '</b></td>' +
          '<td>' + esc(u.communityName || '—') + (u.communityVerified ? ' <span class="small" title="已认证">✓</span>' : '') + '</td>' +
          '<td class="small">' + fmtDate(u.createdAt) + '</td>' +
          '<td><div class="row-actions">' + acts + '</div></td>' +
          '</tr>';
      }).join('');
    }
    html += '</tbody></table></div></div>';
    return html;
  }

  function renderTasks() {
    var html = '<div class="toolbar">' +
      '<div class="search">' + icon('search', 18) + '<input id="taskSearch" type="text" placeholder="搜索任务标题" value="' + esc(taskSearchQ) + '" /></div>' +
      '<select id="taskStatusFilter">' +

        '<option value="ARRIVED"' + (taskStatusF === 'ARRIVED' ? ' selected' : '') + '>已到达</option>' +
        '<option value="COMPLETED"' + (taskStatusF === 'COMPLETED' ? ' selected' : '') + '>已完成</option>' +
        '<option value="CANCELLED"' + (taskStatusF === 'CANCELLED' ? ' selected' : '') + '>已取消</option>' +

      '<span class="small muted">共 ' + filteredTasks().length + ' 单</span>' +

    var tasks = filteredTasks();
    html += '<div class="card"><div class="table-wrap"><table>' +

    if (tasks.length === 0) {

          '<td>' + (t.runnerId ? esc(userName(t.runnerId)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + t.suggestedTip.toFixed(2) + '</td>' +
          '<td class="small">' + fmtDate(t.createdAt) + '</td>' +

            '<button class="mini-btn" data-action="task-status" data-id="' + t.id + '">改状态</button>' +

  function renderDisputes() {
    var html = '<div class="toolbar">' +
      '<div class="search">' + icon('search', 18) + '<input id="disputeSearch" type="text" placeholder="搜索原因 / 描述" value="' + esc(disputeSearchQ) + '" /></div>' +

    if (disputes.length === 0) {
      html += '<tr><td colspan="7"><div class="empty">没有匹配的纠纷</div></td></tr>';
    } else {
      html += disputes.map(function (d) {
        var note = d.resolutionNote ? esc(d.resolutionNote) : '<span class="muted">—</span>';
        var acts = '';

          acts += '<button class="mini-btn mint" data-action="resolve-dispute" data-id="' + d.id + '">解决</button>';
          acts += '<button class="mini-btn danger" data-action="reject-dispute" data-id="' + d.id + '">驳回</button>';
        }
        acts += '<button class="mini-btn yellow" data-action="view-dispute" data-id="' + d.id + '">详情</button>';
        return '<tr>' +
          '<td><div class="cell-main">' + esc(d.reason) + '</div><div class="cell-sub">' + esc(d.description) + '</div></td>' +
          '<td>' + esc(userName(d.openedBy)) + '</td>' +

          '<td>' + badge(disputeTone(d.status), disputeStatusLabel(d.status)) + '</td>' +

          '<td class="small">' + fmtDate(d.createdAt) + '</td>' +
          '<td><div class="row-actions">' + acts + '</div></td>' +
          '</tr>';
      }).join('');
    }
    html += '</tbody></table></div></div>';
    return html;

        '<div><b>运行方式：</b>单文件、前后端不分离。无需服务器，双击 <span class="mono">admin.html</span> 即可打开。</div>' +
        '<div><b>数据存储：</b>全部数据保存在浏览器 <span class="mono">localStorage</span>，不经过任何后端接口。</div>' +
        '<div><b>底层逻辑：</b>与现有后端 <span class="mono">/api/v1/admin/**</span> 的数据模型保持一致（用户/任务/纠纷/状态枚举）。</div>' +
        '<div><b>注意：</b>清空浏览器缓存会清除本地数据，请定期「导出备份」。</div>' +
      '</div>' +
      '<div style="margin-top:16px"><button class="btn btn-danger" data-action="reset">' + icon('refresh', 16) + ' 重置为演示数据</button></div>' +
      '</div>';
    html += '</div>';
    return html;
  }

  /* ---------------- 筛选 ---------------- */
  var userSearchQ = '', userStatusF = '';
  var taskSearchQ = '', taskStatusF = '';
  var disputeSearchQ = '', disputeStatusF = '';

  function filteredUsers() {
    var q = userSearchQ.trim().toLowerCase();
    return db.users.filter(function (u) {
      if (userStatusF && u.accountStatus !== userStatusF) return false;
      if (q && (u.displayName.toLowerCase().indexOf(q) < 0 && u.phoneNumber.indexOf(q) < 0)) return false;
      return true;
    });
  }
  function filteredTasks() {
    var q = taskSearchQ.trim().toLowerCase();
    return db.tasks.filter(function (t) {
      if (taskStatusF && t.status !== taskStatusF) return false;
      if (q && t.title.toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function filteredDisputes() {
    var q = disputeSearchQ.trim().toLowerCase();
    return db.disputes.filter(function (d) {
      if (disputeStatusF && d.status !== disputeStatusF) return false;
      if (q && (d.reason.toLowerCase().indexOf(q) < 0 && d.description.toLowerCase().indexOf(q) < 0)) return false;
      return true;
    });
  }

  /* ---------------- 操作 ---------------- */
  function doSuspendUser(id) {
    var u = userById(id);
    if (!u) return;
    if (u.systemRole === 'ADMIN') { toast('不能停用管理员账号', 'err'); return; }
    u.accountStatus = 'SUSPENDED';
    persist();
    toast('已停用账号：' + u.displayName, 'ok');
    renderView(currentView);
  }
  function doActivateUser(id) {
    var u = userById(id);
    if (!u) return;
    u.accountStatus = 'ACTIVE';
    persist();
    toast('已恢复账号：' + u.displayName, 'ok');
    renderView(currentView);
  }

  function openCreditModal(id) {
    var u = userById(id);
    if (!u) return;
    openModal('调整信用分',
      '<p class="small muted" style="margin-top:0">用户：<b>' + esc(u.displayName) + '</b>（' + esc(u.phoneNumber) + '），当前 <b>' + u.creditScore.toFixed(1) + '</b> 分。</p>' +
      '<div class="field"><label>新信用分（0 ~ 100）</label><input id="creditInput" type="number" min="0" max="100" step="0.1" value="' + u.creditScore.toFixed(1) + '" /></div>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-primary" id="creditSave">保存</button>');
    document.getElementById('creditSave').onclick = function () {
      var v = parseFloat(document.getElementById('creditInput').value);
      if (isNaN(v) || v < 0 || v > 100) { toast('请输入 0~100 之间的分数', 'err'); return; }
      u.creditScore = Math.round(v * 10) / 10;
      persist();
      closeModal();
      toast('信用分已更新为 ' + u.creditScore.toFixed(1), 'ok');
      renderView(currentView);
    };
  }

  function openUserDetail(id) {
    var u = userById(id);
    if (!u) return;
    openModal('用户详情',
      '<div class="detail-row"><span class="k">昵称</span><span class="v">' + esc(u.displayName) + '</span></div>' +
      '<div class="detail-row"><span class="k">头像</span><span class="v">' + esc(u.avatarEmoji) + '</span></div>' +
      '<div class="detail-row"><span class="k">手机号</span><span class="v mono">' + esc(u.phoneNumber) + '</span></div>' +
      '<div class="detail-row"><span class="k">当前模式</span><span class="v">' + esc(modeLabel(u.activeMode)) + '</span></div>' +
      '<div class="detail-row"><span class="k">系统角色</span><span class="v">' + esc(roleLabel(u.systemRole)) + '</span></div>' +
      '<div class="detail-row"><span class="k">账号状态</span><span class="v">' + badge(accountTone(u.accountStatus), accountStatusLabel(u.accountStatus)) + '</span></div>' +
      '<div class="detail-row"><span class="k">信用分</span><span class="v">' + u.creditScore.toFixed(1) + '</span></div>' +
      '<div class="detail-row"><span class="k">社区</span><span class="v">' + esc(u.communityName || '—') + '</span></div>' +
      '<div class="detail-row"><span class="k">社区认证</span><span class="v">' + (u.communityVerified ? '已认证' : '未认证') + '</span></div>' +
      '<div class="detail-row"><span class="k">注册时间</span><span class="v">' + fmtDate(u.createdAt) + '</span></div>' +
      '<div class="detail-row"><span class="k">简介</span><span class="v">' + esc(u.bio || '—') + '</span></div>' +
      '<div class="detail-row"><span class="k">用户 ID</span><span class="v mono">' + esc(u.id) + '</span></div>',
      '<button class="btn btn-primary" data-close="1">关闭</button>');
  }

  function openTaskStatusModal(id) {
    var t = null;
    for (var i = 0; i < db.tasks.length; i++) if (db.tasks[i].id === id) t = db.tasks[i];
    if (!t) return;
    var opts = ['OPEN', 'ACCEPTED', 'PICKED_UP', 'ARRIVED', 'COMPLETED', 'CANCELLED'];
    var sel = '';
    for (var j = 0; j < opts.length; j++) {
      sel += '<option value="' + opts[j] + '"' + (t.status === opts[j] ? ' selected' : '') + '>' + taskStatusLabel(opts[j]) + '</option>';
    }
    openModal('修改任务状态',
      '<p class="small muted" style="margin-top:0">任务：<b>' + esc(t.title) + '</b></p>' +
      '<div class="field"><label>新状态</label><select id="taskStatusSelect">' + sel + '</select></div>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-primary" id="taskStatusSave">保存</button>');
    document.getElementById('taskStatusSave').onclick = function () {
      t.status = document.getElementById('taskStatusSelect').value;
      persist();
      closeModal();
      toast('任务状态已更新为「' + taskStatusLabel(t.status) + '」', 'ok');
      renderView(currentView);
    };
  }

  function openTaskDetail(id) {
    var t = null;
    for (var i = 0; i < db.tasks.length; i++) if (db.tasks[i].id === id) t = db.tasks[i];
    if (!t) return;
    openModal('任务详情',
      '<div class="detail-row"><span class="k">标题</span><span class="v">' + esc(t.title) + '</span></div>' +
      '<div class="detail-row"><span class="k">类型</span><span class="v">' + esc(taskTypeLabel(t.taskType)) + '</span></div>' +
      '<div class="detail-row"><span class="k">状态</span><span class="v">' + badge(taskTone(t.status), taskStatusLabel(t.status)) + '</span></div>' +
      '<div class="detail-row"><span class="k">发布人</span><span class="v">' + esc(userName(t.creatorId)) + '</span></div>' +
      '<div class="detail-row"><span class="k">接单人</span><span class="v">' + (t.runnerId ? esc(userName(t.runnerId)) : '—') + '</span></div>' +
      '<div class="detail-row"><span class="k">小费</span><span class="v">¥' + t.suggestedTip.toFixed(2) + '</span></div>' +
      '<div class="detail-row"><span class="k">发布时间</span><span class="v">' + fmtDate(t.createdAt) + '</span></div>' +
      '<div class="detail-row"><span class="k">描述</span><span class="v">' + esc(t.description || '—') + '</span></div>' +
      '<div class="detail-row"><span class="k">任务 ID</span><span class="v mono">' + esc(t.id) + '</span></div>',
      '<button class="btn btn-primary" data-close="1">关闭</button>');
  }

  function disputeById(id) {
    for (var i = 0; i < db.disputes.length; i++) if (db.disputes[i].id === id) return db.disputes[i];
    return null;
  }
  function openResolveDispute(id) {
    var d = disputeById(id);
    if (!d) return;
    openModal('解决纠纷',
      '<p class="small muted" style="margin-top:0">原因：<b>' + esc(d.reason) + '</b></p>' +
      '<div class="field"><label>处理结论</label><textarea id="resolveNote" rows="3" style="width:100%" placeholder="填写处理说明，例如：已协调双方，平台承担差价..."></textarea></div>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-primary" id="resolveSave">确认解决</button>');
    document.getElementById('resolveSave').onclick = function () {
      d.status = 'RESOLVED';
      d.resolutionNote = document.getElementById('resolveNote').value.trim();
      d.resolvedBy = 'local-admin';
      d.resolvedAt = new Date().toISOString();
      persist();
      closeModal();
      toast('纠纷已解决', 'ok');
      renderView(currentView);
    };
  }
  function openRejectDispute(id) {
    var d = disputeById(id);
    if (!d) return;
    openModal('驳回纠纷',
      '<p class="small muted" style="margin-top:0">原因：<b>' + esc(d.reason) + '</b></p>' +
      '<div class="field"><label>驳回理由（可选）</label><textarea id="rejectNote" rows="3" style="width:100%" placeholder="填写驳回说明..."></textarea></div>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-danger" id="rejectSave">确认驳回</button>');
    document.getElementById('rejectSave').onclick = function () {
      d.status = 'REJECTED';
      d.resolutionNote = document.getElementById('rejectNote').value.trim();
      d.resolvedBy = 'local-admin';
      d.resolvedAt = new Date().toISOString();
      persist();
      closeModal();
      toast('纠纷已驳回', 'ok');
      renderView(currentView);
    };
  }
  function openDisputeDetail(id) {
    var d = disputeById(id);
    if (!d) return;
    openModal('纠纷详情',
      '<div class="detail-row"><span class="k">原因</span><span class="v">' + esc(d.reason) + '</span></div>' +
      '<div class="detail-row"><span class="k">状态</span><span class="v">' + badge(disputeTone(d.status), disputeStatusLabel(d.status)) + '</span></div>' +
      '<div class="detail-row"><span class="k">申诉人</span><span class="v">' + esc(userName(d.openedBy)) + '</span></div>' +
      '<div class="detail-row"><span class="k">被申诉人</span><span class="v">' + esc(userName(d.againstUserId)) + '</span></div>' +
      '<div class="detail-row"><span class="k">创建时间</span><span class="v">' + fmtDate(d.createdAt) + '</span></div>' +
      '<div class="detail-row"><span class="k">描述</span><span class="v">' + esc(d.description) + '</span></div>' +
      '<div class="detail-row"><span class="k">处理结论</span><span class="v">' + esc(d.resolutionNote || '—') + '</span></div>' +
      '<div class="detail-row"><span class="k">纠纷 ID</span><span class="v mono">' + esc(d.id) + '</span></div>',
      '<button class="btn btn-primary" data-close="1">关闭</button>');
  }

  function doExport() {
    var payload = JSON.stringify(db, null, 2);
    var blob = new Blob([payload], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var name = '打个酱油-管理数据-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出备份文件', 'ok');
  }

  function doImport() {
    document.getElementById('importFile').click();
  }
  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!parsed || !parsed.users || !parsed.tasks || !parsed.disputes || !parsed.auth) {
          toast('文件格式不正确，缺少必要字段', 'err');
          return;
        }
        db = parsed;
        persist();
        toast('导入成功，已恢复 ' + db.users.length + ' 用户 / ' + db.tasks.length + ' 任务 / ' + db.disputes.length + ' 纠纷', 'ok');
        renderView(currentView);
      } catch (e) {
        toast('解析失败，请选择有效的 JSON 文件', 'err');
      }
    };
    reader.readAsText(file);
  }

  function doReset() {
    openModal('确认重置',
      '<p class="small" style="margin-top:0">将清空当前所有数据，恢复为内置演示数据（管理员账号密码也会重置为 admin / admin123）。此操作不可撤销。</p>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-danger" id="resetSave">确认重置</button>');
    document.getElementById('resetSave').onclick = function () {
      resetDb();
      closeModal();
      toast('已重置为演示数据', 'ok');
      renderView(currentView);
    };
  }

  /* ---------------- 修改密码 ---------------- */
  function openChangePwd() {
    openModal('修改管理员密码',
      '<div class="field"><label>原密码</label><input id="pwdOld" type="password" /></div>' +
      '<div class="field"><label>新密码（至少 6 位）</label><input id="pwdNew" type="password" /></div>' +
      '<div class="field"><label>确认新密码</label><input id="pwdNew2" type="password" /></div>',
      '<button class="btn" data-close="1">取消</button><button class="btn btn-primary" id="pwdSave">保存</button>');
    document.getElementById('pwdSave').onclick = function () {
      var oldP = document.getElementById('pwdOld').value;
      var newP = document.getElementById('pwdNew').value;
      var newP2 = document.getElementById('pwdNew2').value;
      if (hashStr(db.auth.salt + ':' + oldP) !== db.auth.hash) { toast('原密码不正确', 'err'); return; }
      if (newP.length < 6) { toast('新密码至少 6 位', 'err'); return; }
      if (newP !== newP2) { toast('两次输入的新密码不一致', 'err'); return; }
      db.auth.salt = randomSalt();
      db.auth.hash = hashStr(db.auth.salt + ':' + newP);
      persist();
      closeModal();
      toast('密码已修改', 'ok');
    };
  }

  /* ---------------- 事件绑定 ---------------- */
  function bindInline() {
    var search = document.getElementById('userSearch');
    if (search) search.addEventListener('input', function () { userSearchQ = this.value; renderView('users'); });
    var usf = document.getElementById('userStatusFilter');
    if (usf) usf.addEventListener('change', function () { userStatusF = this.value; renderView('users'); });

    var ts = document.getElementById('taskSearch');
    if (ts) ts.addEventListener('input', function () { taskSearchQ = this.value; renderView('tasks'); });
    var tsf = document.getElementById('taskStatusFilter');
    if (tsf) tsf.addEventListener('change', function () { taskStatusF = this.value; renderView('tasks'); });

    var ds = document.getElementById('disputeSearch');
    if (ds) ds.addEventListener('input', function () { disputeSearchQ = this.value; renderView('disputes'); });
    var dsf = document.getElementById('disputeStatusFilter');
    if (dsf) dsf.addEventListener('change', function () { disputeStatusF = this.value; renderView('disputes'); });
  }

  var ACTION = {
    'suspend-user': doSuspendUser,
    'activate-user': doActivateUser,
    'credit-user': openCreditModal,
    'view-user': openUserDetail,
    'task-status': openTaskStatusModal,
    'view-task': openTaskDetail,
    'resolve-dispute': openResolveDispute,
    'reject-dispute': openRejectDispute,
    'view-dispute': openDisputeDetail,
    'export': doExport,
    'import': doImport,
    'reset': doReset
  };

  document.addEventListener('click', function (e) {
    var closeBtn = e.target.closest('[data-close]');
    if (closeBtn) { closeModal(); return; }

    var goto = e.target.closest('[data-goto]');
    if (goto) { switchView(goto.getAttribute('data-goto')); return; }

    var nav = e.target.closest('[data-view]');
    if (nav) { switchView(nav.getAttribute('data-view')); return; }

    var act = e.target.closest('[data-action]');
    if (act) {
      var fn = ACTION[act.getAttribute('data-action')];
      if (fn) fn(act.getAttribute('data-id'));
    }
  });

  document.getElementById('modalRoot').addEventListener('click', function (e) {
    if (e.target.id === 'modalMask') closeModal();
  });

  /* ---------------- 主题 ---------------- */
  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    document.getElementById('themeBtn').innerHTML = dark ? icon('sun', 18) : icon('moon', 18);
    try { localStorage.setItem(LS_THEME, dark ? 'dark' : 'light'); } catch (e) {}
  }
  document.getElementById('themeBtn').onclick = function () {
    applyTheme(!document.body.classList.contains('dark'));
  };

  /* ---------------- 登录 / 登出 ---------------- */
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = document.getElementById('loginUser').value.trim();
    var password = document.getElementById('loginPass').value;
    if (username === db.auth.username && hashStr(db.auth.salt + ':' + password) === db.auth.hash) {
      try { sessionStorage.setItem(SS_SESSION, '1'); } catch (err) {}
      showApp();
    } else {
      toast('账号或密码错误', 'err');
    }
  });
  document.getElementById('logoutBtn').onclick = function () {
    try { sessionStorage.removeItem(SS_SESSION); } catch (err) {}
    showLogin();
  };
  document.getElementById('changePwdBtn').onclick = openChangePwd;
  document.getElementById('resetLocalBtn').onclick = function () {
    resetDb();
    toast('已重置本地数据，请用 admin / admin123 登录', 'ok');
  };
  document.getElementById('importFile').addEventListener('change', function () {
    if (this.files && this.files[0]) handleImportFile(this.files[0]);
    this.value = '';
  });

  /* ---------------- 启动 ---------------- */
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(LS_THEME); } catch (e) {}
  applyTheme(savedTheme === 'dark');

  if (isLoggedIn()) showApp(); else showLogin();
})();
</script>
</body>
</html>
