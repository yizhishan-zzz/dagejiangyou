spring:
  application:
    name: community-micro-logistics-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/community_micro_logistics}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: never
      continue-on-error: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: warn

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:4100,http://localhost:4100,http://192.168.10.5:4100}
  auth:
    jwt-secret: ${APP_JWT_SECRET:change-this-development-secret-before-production-2026}
    access-token-minutes: ${APP_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${APP_REFRESH_TOKEN_DAYS:30}
