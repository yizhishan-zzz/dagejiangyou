spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: cloud-postgres-pool

server:
  address: 0.0.0.0

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
  auth:
    jwt-secret: ${APP_JWT_SECRET}
    access-token-minutes: ${APP_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${APP_REFRESH_TOKEN_DAYS:30}
    otp:
      expose-code: false
