name: frontend
description: "Community micro-logistics super app frontend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep Android path resolution on the stable Java implementation. The newer
# JNI-based implementation currently requires a toolchain provider that is
# not available in the supported local Android build environment.
dependency_overrides:
  path_provider_android: 2.2.20

flutter:
  uses-material-design: true
