plugins {
    id 'java-gradle-plugin'
}

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/google') }
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    google()
    mavenCentral()
}

group = 'dev.flutter.plugin'
version = '1.0.0'

dependencies {
    implementation files('flutter-gradle-plugin.jar')
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.0'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from zipTree(file('flutter-gradle-plugin.jar'))
}

gradlePlugin {
    plugins {
        flutterPlugin {
            id = 'dev.flutter.flutter-gradle-plugin'
            implementationClass = 'com.flutter.gradle.FlutterPlugin'
        }
        flutterAppPluginLoaderPlugin {
            id = 'dev.flutter.flutter-plugin-loader'
            implementationClass = 'com.flutter.gradle.FlutterAppPluginLoaderPlugin'
        }
    }
}
